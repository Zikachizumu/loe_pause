<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>loe_pause</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" class="hidden" data-theme="dark">
    <div class="bg" id="bg"></div>
    <div class="bg-shade"></div>

    <!-- ANA MENÜ -->
    <section class="screen" id="screenMain">
        <header class="pm-head">
            <span class="pm-logo" aria-hidden="true"><i></i><i></i><i></i></span>
            <h1 class="pm-title"><b id="pmTitleA">PAUSE</b><span id="pmTitleB">MENU</span><span class="pm-suffix" id="pmSuffix"></span></h1>
        </header>

        <nav id="menuList" class="pm-list" role="menu"></nav>
        <nav id="menuQuit" class="pm-quit" role="menu"></nav>

        <aside class="pm-card hidden" id="pmCard"></aside>
        <div class="pm-links" id="pmLinks"></div>
        <button class="pm-gta" id="pmGta" type="button"></button>
    </section>

    <!-- AYARLAR -->
    <section class="screen hidden" id="screenSettings">
        <div class="panel settings">
            <header class="s-head">
                <button class="icon-btn" id="sBack" type="button"><i data-i="back"></i></button>
                <h2 id="sTitle">AYARLAR</h2>
                <span class="grow"></span>
                <button class="icon-btn" id="sClose" type="button"><i data-i="close"></i></button>
            </header>
            <div class="s-body" id="sBody">
                <div class="col cats" id="colCats"></div>
                <div class="col grps" id="colGrps"></div>
                <div class="col rows">
                    <div class="rows-head">
                        <div class="search">
                            <i data-i="search"></i>
                            <input id="q" type="text" autocomplete="off" spellcheck="false" maxlength="40">
                            <kbd>/</kbd>
                        </div>
                        <div class="crumb" id="crumb"></div>
                    </div>
                    <div class="rows-list" id="rowsList"></div>
                </div>
            </div>
            <footer class="hints" id="hintsSettings"></footer>
        </div>
    </section>

    <!-- SAYFA (istatistik / yakında) -->
    <section class="screen hidden" id="screenPage">
        <div class="panel page-panel">
            <header class="s-head">
                <button class="icon-btn" id="pBack" type="button"><i data-i="back"></i></button>
                <h2 id="pTitle"></h2>
                <span class="grow"></span>
                <button class="icon-btn" id="pClose" type="button"><i data-i="close"></i></button>
            </header>
            <div class="page-body" id="pageBody"></div>
            <footer class="hints" id="hintsPage"></footer>
        </div>
    </section>

    <div class="hints hints-main" id="hintsMain"></div>

    <div class="modal hidden" id="modal">
        <div class="modal-box" role="dialog" aria-modal="true">
            <h3 id="modalTitle"></h3>
            <p id="modalText"></p>
            <div class="modal-btns" id="modalBtns"></div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
</div>
<script src="js/icons.js"></script>
<script src="js/app.js"></script>
</body>
</html>
