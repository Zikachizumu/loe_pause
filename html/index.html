<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>loe_pause</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" class="hidden" data-theme="dark">
    <div class="bg" id="bg"></div>
    <div class="bg-shade"></div>

    <!-- ANA MENÜ (HOME): üst şerit, sol menü, sağ kartlar -->
    <section class="screen" id="screenMain">
        <header class="h-top">
            <div class="h-logo"><span class="h-bars" aria-hidden="true"><i></i><i></i><i></i></span><b>LOE</b></div>
            <span class="h-sep"></span>
            <h1 class="h-title"><b id="pmTitleA">PAUSE</b><span id="pmTitleB">MENU</span></h1>
            <span class="h-sep"></span>
            <div class="h-tag">LEGENDS OF EMPIRE<br>ROLEPLAY</div>
            <div class="grow"></div>
            <div class="h-info" id="pmInfo"></div>
        </header>

        <nav id="menuList" class="h-panel h-menu" role="menu"></nav>

        <div class="h-right" id="homeRight">
            <section class="h-panel h-welcome" id="hWelcome"></section>
            <div class="h-grid" id="hStats"></div>
            <div id="hLinks" class="h-links"></div>
        </div>

        <div class="h-foot">
            <div class="h-logo"><span class="h-bars" aria-hidden="true"><i></i><i></i><i></i></span><b>LOE</b></div>
            <span class="h-sep"></span>
            <div class="h-tag">LEGENDS OF EMPIRE<br>ROLEPLAY</div>
        </div>
        <div class="pm-links" id="pmLinks"></div>
    </section>

    <!-- AYARLAR: Game Settings / UI Settings. Ana menü solda kalır; yanında OPTIONS sütunu ve ayar paneli açılır -->
    <section class="screen hidden" id="screenSettings">
        <div class="gs-line" id="gsLine"></div>
        <nav class="gs-opts" id="colCats">
            <div class="gs-opts-title" id="optTitle">OPTIONS</div>
            <div id="optList"></div>
        </nav>
        <section class="gs-panel">
            <header class="gs-head">
                <h2 id="sTitle"></h2>
                <label class="gs-search">
                    <i data-i="search"></i>
                    <input id="q" type="text" autocomplete="off" spellcheck="false" maxlength="40">
                    <kbd>/</kbd>
                </label>
            </header>
            <div class="gs-rows" id="rowsList"></div>
            <div class="gs-note" id="gsNote"></div>
            <footer class="gs-foot"><button class="gs-btn primary hidden" id="gsApply" type="button"></button><button class="gs-btn" id="gsRestore" type="button"></button></footer>
        </section>
    </section>

    <!-- SAYFA (istatistik / yakında) -->
    <section class="screen hidden" id="screenPage">
        <div class="panel page-panel">
            <header class="s-head">
                <button class="icon-btn" id="pBack" type="button"><i data-i="back"></i></button>
                <h2 id="pTitle"></h2>
                <span class="grow"></span>
                <button class="icon-btn" id="pClose" type="button"><i data-i="close"></i></button>
            </header>
            <div class="page-body" id="pageBody"></div>
            <footer class="hints" id="hintsPage"></footer>
        </div>
    </section>

    <div class="hints hints-main" id="hintsMain"></div>

    <div class="modal hidden" id="modal">
        <div class="modal-box" role="dialog" aria-modal="true">
            <h3 id="modalTitle"></h3>
            <p id="modalText"></p>
            <div class="modal-btns" id="modalBtns"></div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
</div>
<script src="js/icons.js"></script>
<script src="js/art.js"></script>
<script src="js/app.js"></script>
</body>
</html>
